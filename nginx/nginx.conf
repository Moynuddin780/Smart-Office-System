# Reverse proxy in front of the app.
#
# Two things here are not decoration: the MJPEG location disables buffering
# (nginx would otherwise hold the whole never-ending response), and the upload
# limit is raised enough for a batch of enrolment photos.

upstream smartoffice {
    server app:8080;
    keepalive 16;
}

server {
    listen 80;
    server_name _;

    client_max_body_size 32m;

    # Live MJPEG preview. Buffering a stream that never ends means it never
    # reaches the browser, so it is turned off explicitly rather than tuned.
    location ~ ^/api/cameras/[0-9]+/live\.mjpg$ {
        proxy_pass http://smartoffice;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 24h;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /ws/ {
        proxy_pass http://smartoffice;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 24h;
        proxy_set_header Host $host;
    }

    location / {
        proxy_pass http://smartoffice;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
